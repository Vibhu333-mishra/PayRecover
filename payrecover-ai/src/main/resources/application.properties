# ===== Application Info =====
spring.application.name=payrecover-ai
server.port=8080

# ===== MySQL Database Connection =====
# createDatabaseIfNotExist=true means you do NOT have to manually create the schema first.
spring.datasource.url=jdbc:mysql://localhost:3306/payrecover_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update -> Hibernate reads our @Entity classes and creates/updates tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Logging (keep it readable while learning) =====
logging.level.org.springframework.web=INFO
logging.level.com.payrecover=DEBUG

# =====================================================================
# LLM (AI) INTEGRATION -- PHASE 5
# =====================================================================
# Provider: Groq. Its API copies OpenAI's request format exactly, so the same
# LlmClient.java also works with OpenAI / OpenRouter / Ollama -- you would only
# change base-url, model and the environment variable name below.
#
# THE API KEY IS NEVER WRITTEN IN THIS FILE.
# ${GROQ_API_KEY:} means "read the GROQ_API_KEY environment variable; if it is
# not set, use an empty string". Empty string -> the app automatically runs in
# deterministic fallback mode instead of crashing.
#
# Set it before starting the app:
#   Windows PowerShell : $env:GROQ_API_KEY="gsk_your_key_here"
#   Windows CMD        : set GROQ_API_KEY=gsk_your_key_here
#   macOS / Linux      : export GROQ_API_KEY=gsk_your_key_here
# Get a free key at https://console.groq.com/keys
payrecover.llm.enabled=true
payrecover.llm.base-url=https://api.groq.com/openai/v1
payrecover.llm.api-key=${GROQ_API_KEY:}

# Model. IMPORTANT: Groq retired the older llama-3.3-70b-versatile and
# llama-3.1-8b-instant IDs in 2026, so tutorials naming those will fail with a
# 404 "model not found". Current general-purpose models are:
#   openai/gpt-oss-20b   -> fastest, plenty good for classification (default)
#   openai/gpt-oss-120b  -> stronger reasoning, a bit slower
payrecover.llm.model=openai/gpt-oss-20b

# Low temperature = repeatable answers. We want a classifier, not a poet.
payrecover.llm.temperature=0.2

# Upper bound on reply length. Do not set this very low: these models spend
# some budget on internal reasoning before writing the JSON, and an empty
# reply is what you get when the budget runs out.
payrecover.llm.max-tokens=1200

# Ask the provider to guarantee valid JSON. Set false if a provider rejects it.
payrecover.llm.json-mode=true

# Timeouts in milliseconds. Without these a hung request would freeze /analyze.
payrecover.llm.connect-timeout-ms=5000
payrecover.llm.read-timeout-ms=25000

