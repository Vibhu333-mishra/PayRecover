# ===== Application Info =====
spring.application.name=payrecover-ai
server.port=8080

# ===== MySQL Database Connection =====
# createDatabaseIfNotExist=true means you do NOT have to manually create the schema first.
spring.datasource.url=jdbc:mysql://localhost:3306/payrecover_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update -> Hibernate reads our @Entity classes and creates/updates tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Logging (keep it readable while learning) =====
logging.level.org.springframework.web=INFO
logging.level.com.payrecover=DEBUG
